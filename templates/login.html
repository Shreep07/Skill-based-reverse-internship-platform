<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillHire - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-container">
        <!-- Left Panel -->
        <div class="auth-left" style="position: relative; overflow: hidden;">
            <div style="z-index: 2; width: 100%;">
                <h1 style="font-size: 36px; font-weight: 800; margin-bottom: 24px; letter-spacing: -1px;">⚡ SkillHire</h1>
                
                <div class="quote-carousel" style="min-height: 130px;">
                    <p class="quote-text" id="quoteText" style="font-size: 20px; line-height: 1.5; font-weight: 600; opacity: 1; transition: opacity 0.5s ease; color: #ffffff;"></p>
                    <div class="quote-author" id="quoteAuthor" style="margin-top: 18px; font-size: 13px; font-weight: 800; color: #a5b4fc; text-transform: uppercase; letter-spacing: 1.5px; opacity: 1; transition: opacity 0.5s ease;"></div>
                </div>

                <div class="carousel-indicators" id="carouselIndicators" style="display: flex; gap: 8px; margin-top: 36px; align-items: center;">
                    <!-- Indicators injected by JS -->
                </div>
            </div>
            
            <!-- Decorative background elements -->
            <div style="position: absolute; top: -50px; right: -50px; width: 250px; height: 250px; background: rgba(255,255,255,0.06); border-radius: 50%; filter: blur(2px);"></div>
            <div style="position: absolute; bottom: -80px; left: -20px; width: 350px; height: 350px; background: rgba(255,255,255,0.04); border-radius: 50%; filter: blur(1px);"></div>
        </div>

        <!-- Right Panel -->
        <div class="auth-right">
            <div class="auth-box">
                <h2>Welcome Back</h2>
                <p class="auth-sub">Enter your credentials to continue</p>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="john@example.com" required>
                    </div>

                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-primary">Sign In</button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="{{ url_for('register') }}">Create one</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const quotes = [
            { text: "Where skills speak louder than resumes.", author: "The SkillHire Way" },
            { text: "Your code is your ultimate resume. Build something incredible.", author: "Future of Hiring" },
            { text: "We don't care where you studied. We care what you can build.", author: "Merit-Based System" },
            { text: "Opportunities unlocked through pure talent and hard work.", author: "Empowering Students" },
            { text: "Turn your logic into an internship. Start solving today.", author: "Code to Career" }
        ];

        let currentQuote = 0;
        const textEl = document.getElementById('quoteText');
        const authorEl = document.getElementById('quoteAuthor');
        const indicatorsContainer = document.getElementById('carouselIndicators');

        // Create indicators
        quotes.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.style.cssText = `height: 6px; border-radius: 99px; background: ${idx === 0 ? '#fff' : 'rgba(255,255,255,0.3)'}; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); width: ${idx === 0 ? '24px' : '6px'};`;
            dot.id = `dot-${idx}`;
            indicatorsContainer.appendChild(dot);
        });

        function updateQuote() {
            textEl.style.opacity = 0;
            authorEl.style.opacity = 0;
            
            setTimeout(() => {
                currentQuote = (currentQuote + 1) % quotes.length;
                textEl.textContent = `"${quotes[currentQuote].text}"`;
                authorEl.textContent = `— ${quotes[currentQuote].author}`;
                
                // Update dots
                quotes.forEach((_, idx) => {
                    const dot = document.getElementById(`dot-${idx}`);
                    dot.style.background = (idx === currentQuote) ? '#fff' : 'rgba(255,255,255,0.3)';
                    dot.style.width = (idx === currentQuote) ? '24px' : '6px';
                });

                textEl.style.opacity = 1;
                authorEl.style.opacity = 1;
            }, 500);
        }

        // Init
        textEl.textContent = `"${quotes[0].text}"`;
        authorEl.textContent = `— ${quotes[0].author}`;

        setInterval(updateQuote, 5500);
    </script>
</body>
</html>
