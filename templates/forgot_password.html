<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - SkillHire</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-body" style="background: radial-gradient(circle at top right, var(--accent) 0%, var(--bg-deep) 100%);">
    <div class="auth-container" style="max-width: 500px;">
        <div class="auth-right" style="width: 100%; border-radius: 16px;">
            <div class="auth-box">
                <div style="text-align: center; margin-bottom: 30px;">
                    <div style="font-size: 38px; font-weight: 900; letter-spacing: -2px; color: var(--primary);">⚡ SKILLHIRE</div>
                    <h2 style="margin-top: 15px; font-size: 24px;">Reset Your Password</h2>
                    <p class="auth-sub">Enter your email and we'll send you instructions</p>
                </div>

                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}

                <form method="POST">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" name="email" placeholder="Enter your registered email" required>
                    </div>

                    <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, var(--primary), var(--accent)); margin-top: 10px;">Send Reset Link</button>
                </form>

                <div class="auth-footer">
                    Remembered your password? <a href="javascript:history.back()" style="color: var(--primary);">Go Back</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
